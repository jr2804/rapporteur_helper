[project]
name = "rapporteur-helper"
version = "1.0.0"
description = "ITU-T Rapporteur's status report generator"
authors = [{ name = "Jan Reimes", email = "jan.reimes@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.13,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.2.1",
    "docxtpl>=0.20.1",
    "lxml>=6.1.1",
    "python-docx>=1.2.0",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://jr2804.github.io/rapporteur-helper/"
Repository = "https://github.com/jr2804/rapporteur-helper"
Documentation = "https://jr2804.github.io/rapporteur-helper/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pytest-cov>=4.0.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "responses>=0.26.1",
]

[build-system]
requires = ["uv_build>=0.8.14"]
build-backend = "uv_build"

[project.scripts]
rapporteur_helper = "rapporteur_helper.__main__:cli"
rapporteur-helper = "rapporteur_helper.__main__:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
